<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — AIPI</title><link rel="stylesheet" href="/styles.css">
<link rel="icon" type="image/png" href="aipi-logo.png">
</head>
<body>
  <header class="site-header"><a class="brand" href="/"><span class="brand-mark"><i></i><i></i></span>    <span><span class="logo-letter">A</span><span class="logo-neutral">i</span>-<span class="logo-letter">PI</span></span></a><nav><a href="/">Home</a><a href="product.html">Product</a></nav><a class="header-cta" href="roadmap.html">Roadmap ↗</a></header>
  <main class="auth-layout"><section class="auth-card"><p class="eyebrow"><span></span> Optional cloud account</p><h1 id="authTitle">Sign in.</h1><p>Local use never requires an account. Sign in only when you want cloud pairing, collaboration, and shared contract governance.</p><div class="oauth-actions"><button class="button oauth-button" type="button" data-provider="github">Continue with GitHub</button><button class="button oauth-button" type="button" data-provider="google">Continue with Google</button></div><div class="auth-divider"><span>or use email</span></div><form id="authForm"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required><button class="button button-dark" type="submit" id="authSubmit">Sign in <span>↗</span></button></form><div class="auth-switch"><button type="button" id="modeToggle">Create an account</button><a href="/">Back home</a></div><p id="authMessage" class="auth-message" role="status"></p></section></main>
  <script src="/config.js"></script><script type="module" src="/auth.js"></script>
</body>
</html>
