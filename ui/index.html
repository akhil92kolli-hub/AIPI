<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>API Forge</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app-loading" aria-live="polite">Loading API Forge…</div>
  <dialog id="modal">
    <form method="dialog" class="modal-sheet">
      <header class="modal-header"><h2 id="modalTitle"></h2><button class="quiet-button" value="cancel">Close</button></header>
      <div id="modalBody" class="modal-body"></div>
      <footer class="modal-actions"><button class="secondary-button" value="cancel">Cancel</button><button class="primary-button" id="modalConfirm" value="default">Save</button></footer>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
